<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIDA – Parašo kūrimas</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f0f2f5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 40px 16px;
  }

  .card {
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.10);
    width: 100%;
    max-width: 520px;
    overflow: hidden;
  }

  .header {
    background: #1a3a5c;
    color: white;
    padding: 16px 24px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .lang-switch {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }

  .lang-switch button {
    padding: 4px 10px;
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 4px;
    background: transparent;
    color: rgba(255,255,255,0.75);
    font-size: 11px;
    font-weight: 700;
    font-family: "Segoe UI", Arial, sans-serif;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }

  .lang-switch button:hover {
    color: #fff;
    border-color: rgba(255,255,255,0.6);
  }

  .lang-switch button.active {
    background: #fff;
    color: #1a3a5c;
    border-color: #fff;
  }

  .form-area {
    padding: 28px 28px 20px;
  }

  .row {
    display: flex;
    align-items: center;
    margin-bottom: 12px;
  }

  .row > label {
    width: 108px;
    font-size: 13px;
    color: #445;
    flex-shrink: 0;
  }

  input[type=text] {
    flex: 1;
    padding: 7px 10px;
    border: 1px solid #c8cdd8;
    border-radius: 4px;
    font-size: 13px;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #222;
    background: #fff;
    outline: none;
    transition: border-color 0.15s;
  }

  input[type=text]:focus {
    border-color: #1e82b4;
    box-shadow: 0 0 0 2px rgba(30,130,180,0.12);
  }

  .opt-section {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid #e4e8f0;
  }

  .opt-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    border: none;
    background: none;
    padding: 0;
    cursor: pointer;
    text-align: left;
    font-family: "Segoe UI", Arial, sans-serif;
  }

  .opt-toggle:hover .opt-title { color: #1e82b4; }
  .opt-toggle:focus-visible { outline: 2px solid #1e82b4; outline-offset: 3px; border-radius: 3px; }

  .opt-chevron {
    display: inline-block;
    width: 0;
    height: 0;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
    border-left: 6px solid #1a3a5c;
    transition: transform 0.15s;
    flex-shrink: 0;
  }

  .opt-toggle[aria-expanded="true"] .opt-chevron {
    transform: rotate(90deg);
  }

  .opt-title {
    font-size: 12px;
    font-weight: 700;
    color: #1a3a5c;
    letter-spacing: 0.2px;
  }

  .banner-panel {
    margin-top: 12px;
  }

  .banner-panel[hidden] {
    display: none;
  }

  .row-top {
    align-items: flex-start;
  }

  .row-top > label {
    padding-top: 8px;
  }

  .banner-fields {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }

  .file-row {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .file-btn {
    display: inline-flex;
    align-items: center;
    padding: 7px 12px;
    border: 1px solid #c8cdd8;
    border-radius: 4px;
    background: #f7f8fb;
    font-size: 12px;
    color: #334;
    cursor: pointer;
    font-family: "Segoe UI", Arial, sans-serif;
    font-weight: 600;
    flex-shrink: 0;
  }

  .file-btn:hover { background: #eef1f6; }

  .file-name {
    font-size: 12px;
    color: #556;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }

  .clear-btn {
    border: none;
    background: none;
    color: #889;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 0 2px;
    flex-shrink: 0;
  }

  .clear-btn:hover { color: #c0392b; }

  .banner-thumb {
    display: none;
    margin: 0 0 12px 108px;
    max-width: calc(100% - 108px);
  }

  .banner-thumb img {
    max-width: 100%;
    max-height: 88px;
    border: 1px solid #d0d8e4;
    border-radius: 4px;
    display: block;
  }

  .btn-row {
    text-align: center;
    margin-top: 22px;
  }

  #btnOK {
    padding: 10px 40px;
    background: #1a6fa0;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 14px;
    font-weight: 700;
    font-family: "Segoe UI", Arial, sans-serif;
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: background 0.15s;
  }

  #btnOK:hover { background: #1580b8; }

  .note {
    text-align: center;
    font-size: 11px;
    color: #888;
    margin-top: 10px;
  }

  /* Instrukcijų ekranas */
  .instr-area {
    display: none;
    padding: 24px 28px 28px;
  }

  .success-bar {
    background: #e6f4ea;
    border-left: 4px solid #34a853;
    padding: 10px 14px;
    margin-bottom: 22px;
    font-size: 13px;
    color: #1e6e3a;
    font-weight: 600;
    border-radius: 0 4px 4px 0;
  }

  .instr-title {
    font-size: 15px;
    font-weight: 700;
    color: #1a3a5c;
    margin-bottom: 18px;
  }

  .step {
    display: flex;
    align-items: flex-start;
    margin-bottom: 14px;
    gap: 12px;
  }

  .step-num {
    background: #1a6fa0;
    color: white;
    font-size: 11px;
    font-weight: 700;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .step-text {
    font-size: 13px;
    color: #222;
    line-height: 1.55;
  }

  .step-text b {
    color: #1a3a5c;
  }

  .ok-btn {
    display: block;
    margin: 26px auto 0;
    padding: 9px 36px;
    background: #1a6fa0;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 13px;
    font-weight: 700;
    font-family: "Segoe UI", Arial, sans-serif;
    cursor: pointer;
    transition: background 0.15s;
  }

  .ok-btn:hover { background: #1580b8; }

  /* Parašo peržiūra */
  .preview-wrap {
    margin: 0 0 18px 0;
    border: 1px solid #d0d8e4;
    border-radius: 6px;
    overflow: hidden;
  }

  .preview-label {
    background: #f0f4f8;
    border-bottom: 1px solid #d0d8e4;
    padding: 6px 12px;
    font-size: 11px;
    color: #667;
    font-weight: 600;
    letter-spacing: 0.3px;
  }

  .preview-body {
    padding: 8px;
    background: #fff;
  }

  .preview-body img {
    max-width: 100%;
    height: auto;
  }

  /* Clipboard pranešimas */
  #clipMsg {
    display: none;
    text-align: center;
    font-size: 12px;
    color: #1e6e3a;
    background: #e6f4ea;
    border-radius: 4px;
    padding: 6px 10px;
    margin-top: 10px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <span data-i18n="header">MIDA &nbsp;•&nbsp; Elektroninio parašo kūrimas</span>
    <div class="lang-switch">
      <button type="button" id="langLt" onclick="setLang('lt')">LT</button>
      <button type="button" id="langEn" onclick="setLang('en')">EN</button>
    </div>
  </div>

  <!-- Formos ekranas -->
  <div class="form-area" id="formArea">
    <div class="row">
      <label data-i18n="firstName">Vardas</label>
      <input type="text" id="vardas" autocomplete="given-name" />
    </div>
    <div class="row">
      <label data-i18n="lastName">Pavardė</label>
      <input type="text" id="pavarde" autocomplete="family-name" />
    </div>
    <div class="row">
      <label data-i18n="jobTitle">Pareigos</label>
      <input type="text" id="pareigos" />
    </div>
    <div class="row">
      <label data-i18n="phone">Telefonas</label>
      <input type="text" id="telefonas" value="+370 " />
    </div>
    <div class="row">
      <label data-i18n="email">El. paštas</label>
      <input type="text" id="elpastas" autocomplete="email" />
    </div>

    <div class="opt-section">
      <button type="button" class="opt-toggle" id="bannerToggle" onclick="toggleBannerFields()" aria-expanded="false" aria-controls="bannerPanel">
        <span class="opt-chevron" aria-hidden="true"></span>
        <span class="opt-title" data-i18n="bannerSection">Baneris (neprivaloma)</span>
      </button>
      <div class="banner-panel" id="bannerPanel" hidden>
        <div class="row row-top">
          <label data-i18n="banner">Paveikslėlis</label>
          <div class="banner-fields">
            <input type="text" id="banerisUrl" autocomplete="off" data-i18n-placeholder="bannerUrlPlaceholder" placeholder="https://" />
            <div class="file-row">
              <label class="file-btn">
                <input type="file" id="banerisFile" accept="image/*" hidden />
                <span data-i18n="bannerChooseFile">Įkelti failą</span>
              </label>
              <span class="file-name" id="bannerFileName"></span>
              <button type="button" class="clear-btn" id="bannerClearBtn" onclick="clearBanner()" style="display:none" aria-label="Clear">&times;</button>
            </div>
          </div>
        </div>
        <div class="banner-thumb" id="bannerThumb"><img id="bannerThumbImg" alt=""></div>
        <div class="row">
          <label data-i18n="bannerLink">Nuoroda</label>
          <input type="text" id="banerisLink" autocomplete="off" data-i18n-placeholder="bannerLinkPlaceholder" placeholder="https://" />
        </div>
      </div>
    </div>

    <div class="btn-row">
      <button id="btnOK" onclick="kurti()" data-i18n="createBtn">✓ &nbsp;Sukurti parašą</button>
    </div>
    <div class="note" data-i18n="formNote">Parašas bus sugeneruotas ir nukopijuotas į iškarpinę</div>
  </div>

  <!-- Instrukcijų ekranas -->
  <div class="instr-area" id="instrArea">
    <div class="success-bar" data-i18n="successBar">✓ &nbsp;Parašas sėkmingai sukurtas ir nukopijuotas į iškarpinę!</div>

    <!-- Parašo peržiūra -->
    <div class="preview-wrap">
      <div class="preview-label" data-i18n="previewLabel">PARAŠO PERŽIŪRA</div>
      <div class="preview-body" id="previewBody"></div>
    </div>

    <button id="copyAgainBtn" style="display:block;margin:0 auto 20px;padding:8px 28px;background:#1a6fa0;color:white;border:none;border-radius:4px;font-size:12px;font-weight:700;font-family:'Segoe UI',Arial,sans-serif;cursor:pointer;" onclick="kopijuoti()" data-i18n="copyAgainBtn">📋 &nbsp;Kopijuoti parašą dar kartą</button>
    <div id="clipMsg" data-i18n="clipMsg">✓ Parašas nukopijuotas į iškarpinę!</div>

    <div class="instr-title" data-i18n="instrTitle">Kaip aktyvuoti parašą Outlook:</div>

    <div class="step">
      <div class="step-num">1</div>
      <div class="step-text" data-i18n-html="step1"></div>
    </div>
    <div class="step">
      <div class="step-num">2</div>
      <div class="step-text" data-i18n-html="step2"></div>
    </div>
    <div class="step">
      <div class="step-num">3</div>
      <div class="step-text" data-i18n-html="step3"></div>
    </div>
    <div class="step">
      <div class="step-num">4</div>
      <div class="step-text" data-i18n-html="step4"></div>
    </div>
    <div class="step">
      <div class="step-num">5</div>
      <div class="step-text" data-i18n-html="step5"></div>
    </div>

    <button class="ok-btn" onclick="reset()" data-i18n="backBtn">← Grįžti / naujas parašas</button>
  </div>
</div>

<!-- Paslėptas clipboard pagalbininkas -->
<div id="_clipHelper" contenteditable="true" style="position:fixed;left:-9999px;top:0;width:1px;height:1px;overflow:hidden;opacity:0;"></div>

<script>
let sigHtml = "";
let bannerSrc = "";
let bannerWidth = 480;
let currentLang = localStorage.getItem("mida-sig-lang") || (navigator.language.startsWith("lt") ? "lt" : "en");

const i18n = {
  lt: {
    title: "MIDA – Parašo kūrimas",
    header: "MIDA \u00a0•\u00a0 Elektroninio parašo kūrimas",
    firstName: "Vardas",
    lastName: "Pavardė",
    jobTitle: "Pareigos",
    phone: "Telefonas",
    email: "El. paštas",
    bannerSection: "Baneris (neprivaloma)",
    banner: "Paveikslėlis",
    bannerLink: "Nuoroda",
    bannerUrlPlaceholder: "Paveikslėlio adresas (https://…)",
    bannerLinkPlaceholder: "Adresas paspaudus (https://…)",
    bannerChooseFile: "Įkelti failą",
    bannerFileError: "Nepavyko nuskaityti paveikslėlio.",
    bannerClear: "Pašalinti banerį",
    createBtn: "✓ \u00a0Sukurti parašą",
    formNote: "Parašas bus sugeneruotas ir nukopijuotas į iškarpinę",
    successBar: "✓ \u00a0Parašas sėkmingai sukurtas ir nukopijuotas į iškarpinę!",
    previewLabel: "PARAŠO PERŽIŪRA",
    copyAgainBtn: "📋 \u00a0Kopijuoti parašą dar kartą",
    clipMsg: "✓ Parašas nukopijuotas į iškarpinę!",
    instrTitle: "Kaip aktyvuoti parašą Outlook:",
    backBtn: "← Grįžti / naujas parašas",
    fillAllFields: "Prašome užpildyti visus laukus.",
    copyFailed: "Nepavyko automatiškai nukopijuoti. Pasirinkite parašą peržiūros srityje ir nukopijuokite rankiniu būdu (CTRL+C).",
    sigGreeting: "Pagarbiai,",
    step1: 'Outlook viršuje dešinėje spustelėkite <b>⚙ Nustatymai</b> (krumpliaračio piktogramą)',
    step2: 'Pasirinkite <b>„Parašas"</b> (angl. <b>„Signature"</b>)',
    step3: 'Paspauskite <b>„Įtraukti parašą"</b> (angl. <b>„Create signature"</b>)',
    step4: 'Atsidariusiame lange įveskite parašo pavadinimą ir įklijuokite Jūsų sugeneruotą parašą paspausdami <b>CTRL+V</b> arba paspausdami dešinį pelės klavišą ir pasirinkę <b>„Įklijuoti"</b> (angl. <b>„Paste"</b>). Įklijavus parašą, kiek žemiau pažymėkite varnelę ant <b>„Nustatyti numatytąją naujiems pranešimams"</b>',
    step5: 'Atlikus visus numatytus veiksmus, žemiau spustelėkite <b>„Įrašyti"</b> (angl. <b>„Save"</b>)',
  },
  en: {
    title: "MIDA – Signature builder",
    header: "MIDA \u00a0•\u00a0 Email signature builder",
    firstName: "First name",
    lastName: "Last name",
    jobTitle: "Job title",
    phone: "Phone",
    email: "Email",
    bannerSection: "Banner (optional)",
    banner: "Image",
    bannerLink: "Link",
    bannerUrlPlaceholder: "Image address (https://…)",
    bannerLinkPlaceholder: "Destination URL (https://…)",
    bannerChooseFile: "Upload file",
    bannerFileError: "Could not read the image.",
    bannerClear: "Remove banner",
    createBtn: "✓ \u00a0Create signature",
    formNote: "The signature will be generated and copied to your clipboard",
    successBar: "✓ \u00a0Signature created and copied to clipboard!",
    previewLabel: "SIGNATURE PREVIEW",
    copyAgainBtn: "📋 \u00a0Copy signature again",
    clipMsg: "✓ Signature copied to clipboard!",
    instrTitle: "How to activate the signature in Outlook:",
    backBtn: "← Back / new signature",
    fillAllFields: "Please fill in all fields.",
    copyFailed: "Could not copy automatically. Select the signature in the preview area and copy manually (CTRL+C).",
    sigGreeting: "Best regards,",
    step1: 'In Outlook, click <b>⚙ Settings</b> (gear icon) in the top right',
    step2: 'Select <b>Signatures</b>',
    step3: 'Click <b>New signature</b> or <b>Create signature</b>',
    step4: 'Enter a name for the signature and paste your generated signature with <b>CTRL+V</b> or right-click and choose <b>Paste</b>. After pasting, check <b>Set as default for new messages</b>',
    step5: 'When finished, click <b>Save</b>',
  },
};

function t(key) {
  return i18n[currentLang][key] ?? i18n.lt[key] ?? key;
}

function setLang(lang) {
  if (!i18n[lang]) return;
  currentLang = lang;
  localStorage.setItem("mida-sig-lang", lang);
  document.documentElement.lang = lang;
  applyTranslations();
  document.getElementById("langLt").classList.toggle("active", lang === "lt");
  document.getElementById("langEn").classList.toggle("active", lang === "en");
  if (sigHtml) regenerateSignature();
}

function applyTranslations() {
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const key = el.getAttribute("data-i18n");
    el.textContent = t(key);
  });
  document.querySelectorAll("[data-i18n-html]").forEach((el) => {
    const key = el.getAttribute("data-i18n-html");
    el.innerHTML = t(key);
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
    const key = el.getAttribute("data-i18n-placeholder");
    el.placeholder = t(key);
  });
  const clearBtn = document.getElementById("bannerClearBtn");
  if (clearBtn) clearBtn.setAttribute("aria-label", t("bannerClear"));
}

function escapeAttr(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function buildBannerHtml() {
  const src = getBannerSrc();
  if (!src) return "";
  const link = document.getElementById("banerisLink").value.trim();
  const width = bannerSrc && !document.getElementById("banerisUrl").value.trim() ? bannerWidth : 480;
  const img = `<img src="${escapeAttr(src)}" alt="" width="${width}" style="display:block;border:0;outline:none;text-decoration:none;max-width:${width}px;height:auto;">`;
  const inner = /^https?:\/\//i.test(link)
    ? `<a href="${escapeAttr(link)}" target="_blank" style="display:block;">${img}</a>`
    : img;
  return `<table cellpadding="0" cellspacing="0" border="0" style="margin-top:12px;">
  <tr>
    <td>${inner}</td>
  </tr>
</table>`;
}

function buildSignatureHtml(vD, pD, pareigos, telefonas, elpastas) {
  const logoHtml = '<a href="https://www.mida.lt" target="_blank" style="display:block;"><img src="https://mida.lt/mida_logo.png" alt="MIDA" width="120" style="display:block;border:0;"></a>';
  return `<p style="margin:0 0 4px 0;font-family:Arial,sans-serif;font-size:12px;color:#111;">--</p>
<p style="margin:0 0 12px 0;font-family:Arial,sans-serif;font-size:12px;color:#111;">${t("sigGreeting")}</p>
<table cellpadding="0" cellspacing="0" border="0" style="font-family:Arial,sans-serif;">
  <tr>
    <td style="vertical-align:middle;padding:16px 20px 16px 0;">${logoHtml}</td>
    <td style="width:2px;background:#215E99;padding:0;"></td>
    <td style="vertical-align:top;padding:16px 0 16px 20px;">
      <p style="margin:0 0 10px 0;font-size:13px;font-weight:700;color:#111;">${vD} ${pD}</p>
      <p style="margin:0 0 4px 0;font-size:11px;color:#111;">${pareigos}</p>
      <p style="margin:0 0 4px 0;font-size:11px;color:#111;">${telefonas}</p>
      <p style="margin:0 0 14px 0;font-size:11px;color:#111;"><a href="mailto:${elpastas}" style="color:#111;text-decoration:none;">${elpastas}</a></p>
      <p style="margin:0;font-size:11px;"><a href="https://www.mida.lt" target="_blank" style="color:#111;text-decoration:none;">www.mida.lt</a></p>
    </td>
  </tr>
</table>${buildBannerHtml()}`;
}

function getBannerSrc() {
  const url = document.getElementById("banerisUrl").value.trim();
  return url || bannerSrc;
}

function showBannerThumb(src) {
  const wrap = document.getElementById("bannerThumb");
  const img = document.getElementById("bannerThumbImg");
  img.src = src;
  wrap.style.display = "block";
  document.getElementById("bannerClearBtn").style.display = "inline";
}

function hideBannerThumb() {
  const wrap = document.getElementById("bannerThumb");
  const img = document.getElementById("bannerThumbImg");
  img.removeAttribute("src");
  wrap.style.display = "none";
}

function setBannerFieldsOpen(open) {
  const toggle = document.getElementById("bannerToggle");
  const panel = document.getElementById("bannerPanel");
  toggle.setAttribute("aria-expanded", open ? "true" : "false");
  panel.hidden = !open;
}

function toggleBannerFields() {
  const open = document.getElementById("bannerToggle").getAttribute("aria-expanded") !== "true";
  setBannerFieldsOpen(open);
}

function clearBanner() {
  bannerSrc = "";
  bannerWidth = 480;
  document.getElementById("banerisUrl").value = "";
  document.getElementById("banerisFile").value = "";
  document.getElementById("bannerFileName").textContent = "";
  document.getElementById("bannerClearBtn").style.display = "none";
  hideBannerThumb();
}

function fileToBannerDataUrl(file) {
  return new Promise((resolve, reject) => {
    if (file.type === "image/gif") {
      const reader = new FileReader();
      reader.onload = () => resolve({ dataUrl: reader.result, width: 480 });
      reader.onerror = reject;
      reader.readAsDataURL(file);
      return;
    }
    const objUrl = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const maxW = 600;
      let w = img.naturalWidth;
      let h = img.naturalHeight;
      if (w > maxW) {
        h = Math.round((h * maxW) / w);
        w = maxW;
      }
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      const isPng = file.type === "image/png";
      const dataUrl = isPng ? canvas.toDataURL("image/png") : canvas.toDataURL("image/jpeg", 0.88);
      URL.revokeObjectURL(objUrl);
      resolve({ dataUrl, width: w });
    };
    img.onerror = () => {
      URL.revokeObjectURL(objUrl);
      reject(new Error("image"));
    };
    img.src = objUrl;
  });
}

function initBannerInputs() {
  const fileInput = document.getElementById("banerisFile");
  const urlInput = document.getElementById("banerisUrl");

  fileInput.addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try {
      const { dataUrl, width } = await fileToBannerDataUrl(file);
      bannerSrc = dataUrl;
      bannerWidth = width;
      urlInput.value = "";
      document.getElementById("bannerFileName").textContent = file.name;
      showBannerThumb(dataUrl);
    } catch (err) {
      clearBanner();
      alert(t("bannerFileError"));
    }
  });

  urlInput.addEventListener("input", () => {
    const url = urlInput.value.trim();
    if (url) {
      bannerSrc = "";
      bannerWidth = 480;
      fileInput.value = "";
      document.getElementById("bannerFileName").textContent = "";
      showBannerThumb(url);
    } else {
      bannerSrc = "";
      hideBannerThumb();
      document.getElementById("bannerClearBtn").style.display = "none";
    }
  });
}

function regenerateSignature() {
  const vardas = document.getElementById("vardas").value.trim();
  const pavarde = document.getElementById("pavarde").value.trim();
  const pareigos = document.getElementById("pareigos").value.trim();
  const telefonas = document.getElementById("telefonas").value.trim();
  const elpastas = document.getElementById("elpastas").value.trim();
  if (!vardas || !pavarde || !pareigos || !telefonas || !elpastas) return;
  const vD = vardas.charAt(0).toUpperCase() + vardas.slice(1).toLowerCase();
  const pD = pavarde.toUpperCase();
  sigHtml = buildSignatureHtml(vD, pD, pareigos, telefonas, elpastas);
  document.getElementById("previewBody").innerHTML = sigHtml;
}

function kurti() {
  const vardas   = document.getElementById("vardas").value.trim();
  const pavarde  = document.getElementById("pavarde").value.trim();
  const pareigos = document.getElementById("pareigos").value.trim();
  const telefonas= document.getElementById("telefonas").value.trim();
  const elpastas = document.getElementById("elpastas").value.trim();

  if (!vardas || !pavarde || !pareigos || !telefonas || !elpastas) {
    alert(t("fillAllFields"));
    return;
  }

  const vD = vardas.charAt(0).toUpperCase() + vardas.slice(1).toLowerCase();
  const pD = pavarde.toUpperCase();
  sigHtml = buildSignatureHtml(vD, pD, pareigos, telefonas, elpastas);

  document.getElementById("previewBody").innerHTML = sigHtml;
  kopijuoti();
  document.getElementById("formArea").style.display = "none";
  document.getElementById("instrArea").style.display = "block";
}

async function kopijuoti() {
  if (!sigHtml) return;

  if (navigator.clipboard && window.ClipboardItem) {
    try {
      const blob = new Blob([sigHtml], { type: "text/html" });
      await navigator.clipboard.write([new ClipboardItem({ "text/html": blob })]);
      rodytikMsg();
      return;
    } catch (e) {}
  }

  try {
    const el = document.getElementById("_clipHelper");
    el.innerHTML = sigHtml;
    el.style.position = "fixed";
    el.style.left = "0";
    el.style.top = "0";
    el.style.opacity = "0";
    el.style.pointerEvents = "none";

    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    document.execCommand("copy");
    sel.removeAllRanges();

    el.style.left = "-9999px";
    rodytikMsg();
  } catch (e) {
    alert(t("copyFailed"));
  }
}

function rodytikMsg() {
  const msg = document.getElementById("clipMsg");
  msg.style.display = "block";
  setTimeout(() => { msg.style.display = "none"; }, 3000);
}

function reset() {
  document.getElementById("instrArea").style.display = "none";
  document.getElementById("formArea").style.display = "block";
  document.getElementById("vardas").value = "";
  document.getElementById("pavarde").value = "";
  document.getElementById("pareigos").value = "";
  document.getElementById("telefonas").value = "+370 ";
  document.getElementById("elpastas").value = "";
  document.getElementById("banerisLink").value = "";
  clearBanner();
  setBannerFieldsOpen(false);
  sigHtml = "";
}

initBannerInputs();
setLang(currentLang);
