replicaCount: 1

image:
  repository: registry.onmida.lt/signature
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10

ingress:
  enabled: true
  hosts:
    - host: signature.onmida.lt
  traefik:
    enabled: true
    entryPoints:
      - websecure
    tls:
      enabled: true
      secretName: ""
    oauth2:
      enabled: true
      middlewareName: signature-oauth2
      proxyServiceName: oauth2-proxy
      proxyServiceNamespace: authorizer
      proxyServicePort: 4180
      forwardAuthPath: /oauth2/auth

gateway:
  enabled: false
  hostnames:
    - signature.onmida.lt
  parentRefs: []
  cloudArmor:
    enabled: false
    securityPolicy: ""

oidc:
  issuerURL: https://auth.onmida.lt/realms/mida
  clientId: oauth2-proxy

oauth2Proxy:
  enabled: false
  clientId: oauth2-proxy
  oidcIssuerURL: https://auth.onmida.lt/realms/mida
  clientSecret: ""
  cookieSecret: ""
  cookieName: _oauth2_proxy_signature
  oidcGroupsClaim: groups
  replicas: 1
  image:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: v7.15.4
    pullPolicy: IfNotPresent

autoscaling:
  enabled: false
