# GKE. signature.onmida.lt is served by authorizer oauth2-proxy (Cloud Armor),
# which proxies / to http://signature.signature.svc.cluster.local:80.
# Do not attach an HTTPRoute here; that would bypass oauth2-proxy.
# Usage: helm upgrade --install signature . -f values-gke-gateway.yaml -n signature

image:
  repository: europe-north2-docker.pkg.dev/project-bcfa376f-0637-457a-ae0/k8s-registry/signature
  pullPolicy: Always
  tag: latest

# Cluster CPU requests are tight; keep one replica with a small request.
replicaCount: 1

service:
  type: ClusterIP

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

ingress:
  enabled: false
  traefik:
    enabled: false
    oauth2:
      enabled: false

gateway:
  enabled: false

oauth2Proxy:
  enabled: false
