{{- $gateway := .Values.gateway | default dict }}
{{- if $gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "signature.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "signature.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- range $gateway.parentRefs }}
    - name: {{ .name | quote }}
      {{- if .namespace }}
      namespace: {{ .namespace | quote }}
      {{- end }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName | quote }}
      {{- end }}
    {{- end }}
  hostnames:
    {{- range $gateway.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    {{- $oauth := .Values.oauth2Proxy | default dict }}
    {{- if $oauth.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ printf "%s-oauth2-proxy" (include "signature.fullname" .) }}
          port: 4180
    {{- else }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "signature.fullname" . }}
          port: {{ .Values.service.port }}
    {{- end }}
{{- end }}
