{{- $proxy := .Values.oauth2Proxy | default dict }}
{{- if and .Values.ingress.enabled .Values.ingress.traefik.enabled .Values.ingress.traefik.oauth2.enabled (not $proxy.enabled) }}
{{- $oauth := .Values.ingress.traefik.oauth2 }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $oauth.middlewareName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "signature.labels" . | nindent 4 }}
spec:
  forwardAuth:
    address: {{ printf "http://%s.%s.svc.cluster.local:%v%s" $oauth.proxyServiceName $oauth.proxyServiceNamespace $oauth.proxyServicePort $oauth.forwardAuthPath | quote }}
    trustForwardHeader: true
    authResponseHeaders:
      - "X-Auth-Request-User"
      - "X-Auth-Request-Email"
      - "X-Auth-Request-Access-Token"
      - "X-Auth-Request-Groups"
      - "X-Forwarded-Groups"
      - "X-Forwarded-Access-Token"
      - "X-Auth-Request-Preferred-Username"
      - "Authorization"
{{- end }}
