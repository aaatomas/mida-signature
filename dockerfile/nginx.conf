worker_processes auto;
error_log /tmp/nginx-error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /tmp/nginx-access.log;
    sendfile on;
    keepalive_timeout 65;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Cluster DNS so /api/whoami can reach Keycloak by service name.
    resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;

    # oauth2-proxy --pass-access-token sets X-Forwarded-Access-Token on upstream requests.
    map $http_x_forwarded_access_token $whoami_authorization {
        default "Bearer $http_x_forwarded_access_token";
        ""      $http_authorization;
    }
    map $http_x_forwarded_access_token $tok_present {
        default 1;
        ""      0;
    }
    map $http_authorization $auth_present {
        default 1;
        ""      0;
    }
    log_format whoami '$remote_addr $request $status up=$upstream_status tok=$tok_present auth=$auth_present';

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /health {
            default_type application/json;
            add_header Cache-Control no-store always;
            return 200 '{"ok":true}';
        }

        # Proxy Bearer access token to Keycloak userinfo (given_name, family_name, phone_number).
        location = /api/whoami {
            access_log /tmp/nginx-whoami.log whoami;
            set $kc_userinfo "http://keycloak.authorizer.svc.cluster.local:8080/realms/mida/protocol/openid-connect/userinfo";
            proxy_pass $kc_userinfo;
            proxy_http_version 1.1;
            proxy_set_header Authorization $whoami_authorization;
            proxy_set_header Host keycloak.authorizer.svc.cluster.local;
            proxy_set_header Connection "";
            proxy_hide_header Set-Cookie;
            add_header Cache-Control "no-store" always;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
